[project]
name = "mtm"
version = "2.0"
description = "Mountaintop Mining"
authors = [{ name = "SkyTruth" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "Apache License, Version 2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cligj>=0.7.2,<0.8",
    "datetime>=5.5,<6",
    "earthengine-api>=1.5.5,<2",
    "fiona>=1.10.1,<2",
    "geopandas>=1.0.1,<2",
    "pandas>=2.2.3,<3",
    "requests>=2.32.3,<3",
    "wget>=3.2,<4",
    "click>=8.1.8,<9",
    "centerline>=1.1.1,<2",
    "networkx>=3.4.2,<4",
    "shapely>=2.0.7,<3",
    "numpy>=2.2.3,<3",
    "rasterio>=1.4.3,<2",
    "scikit-image>=0.25.2,<0.26",
    "whitebox_workflows==1.3.3",
    "cloud-sql-python-connector[pg8000]>=1.18.4,<2",
    "sqlalchemy>=2.0.43,<3",
    "geoalchemy2>=0.18.0,<0.19",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = ["mtm_utils"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
